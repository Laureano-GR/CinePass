<div class="home-container">
  <div class="banner">
    <img src="assets/banners/banner.png" alt="Banner de películas" class="banner-image">
  </div>
  
  <h1>{{ title }}</h1>
  
  <h2>Películas en Cartelera</h2>
  
  <div class="movies-grid">
    <div 
      *ngFor="let movie of movies" 
      class="movie-card" 
      (click)="navigateToMovieDetails(movie.id)">
      <img [src]="movie.poster" [alt]="movie.name" class="movie-poster">
      <h3>{{ movie.name }}</h3>
      <p>Género: {{ movie.genre.name }}</p>
      <p>Duración: {{ movie.duration }} minutos</p>
      <p>Clasificación: {{ movie.contentRating.name }}</p>
    </div>
  </div>

  <ng-template #noMovies>
    <div class="no-movies-message">
      No hay películas disponibles para esta sucursal en este momento.
    </div>
  </ng-template>
</div>
