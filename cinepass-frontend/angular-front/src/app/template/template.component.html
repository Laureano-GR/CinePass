<div class="app-container">
  <header class="app-header">
    <nav>
      <ul>
        <li><a routerLink="/"><img src="assets/logo.png" alt="CinePass Logo" style="height: 40px;"></a></li> <!-- Cambiar inicio por logo de CinePass -->
      </ul>
    </nav>
    <div *ngIf="subsidiaryName$ | async as subsidiaryName" class="subsidiary-info">
      Sucursal: {{ subsidiaryName }}
      <button (click)="changeSubsidiary()">Cambiar Sucursal</button>
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>&copy; 2024 CinePass. Todos los derechos reservados.</p>
  </footer>
</div>
