<div class="container">
  <h2>Seleccione una sucursal</h2>
  <select 
    (change)="onSubsidiarySelect($event)" 
    [(ngModel)]="selectedSubsidiaryCode"
    aria-label="Selección de sucursal"
    class="subsidiary-select"
  >
    <option value="">Seleccione una subsidiaria</option>
    <option *ngFor="let subsidiary of subsidiaries" [value]="subsidiary.subsidiaryCode">
      {{ subsidiary.name }}
    </option>
  </select>
</div>
